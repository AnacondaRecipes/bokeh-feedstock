{% set name = "bokeh" %}
{% set version = "3.10.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/bokeh-{{ version }}.tar.gz
    sha256: e1dc21c4fa02f793b7c6acb2b439311924f46912b1d1ae1c7b058f8245b54fe8
  - url: https://github.com/{{ name }}/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
    sha256: f992f3cab92c78d1f4e29663b57c34c6928ebb2e6510c0f42a8427b13b29ac18
    folder: gh

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - bokeh = bokeh.__main__:main
  skip: true  # [py<312]

requirements:
  host:
    - pip
    - python
    - setuptools >=77
    - setuptools-git-versioning
    - colorama
  run:
    - python
    - jinja2 >=2.9
    - contourpy >=1.2
    - narwhals >=1.13
    - numpy >=1.16
    - packaging >=16.8
    - pillow >=7.1.0
    - pyyaml >=3.10
    - tornado >=6.2
    - xyzservices >=2021.09.1

test:
  source_files:
    - gh/tests
  imports:
    - bokeh
    - bokeh.application
    - bokeh.application.handlers
    - bokeh.application.handlers.code_runner
    - bokeh.application.handlers.handler
    - bokeh.client
    - bokeh.colors
    - bokeh.colors.color
    - bokeh.command.util
    - bokeh.core.enums
    - bokeh.core.properties
    - bokeh.core.property._sphinx
    - bokeh.core.property.descriptors
    - bokeh.core.property.singletons
    - bokeh.core.property.vectorization
    - bokeh.core.serialization
    - bokeh.core.templates
    - bokeh.core.types
    - bokeh.document
    - bokeh.embed
    - bokeh.embed.bundle
    - bokeh.embed.elements
    - bokeh.embed.server
    - bokeh.embed.util
    - bokeh.ext
    - bokeh.io.doc
    - bokeh.layouts
    - bokeh.model
    - bokeh.models
    - bokeh.palettes
    - bokeh.resources
    - bokeh.server.auth_provider
    - bokeh.server.callbacks
    - bokeh.server.tornado
    - bokeh.settings
    - bokeh.util.compiler
    - bokeh.util.dependencies
    - bokeh.util.info
    - bokeh.util.logconfig
    - bokeh.util.options
    - bokeh.util.serialization
    - bokeh.util.strings
    - bokeh.util.terminal
    - bokeh.util.token
    - bokeh.util.warnings
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Scope reduced to the models suite; the dev/server suites need node.js and live servers.
    - pytest -vv gh/tests/unit/bokeh/models/
    - bokeh --help
    - bokeh info

about:
  home: https://bokeh.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Bokeh is an interactive visualization library for modern web browsers.
  description: |
    Bokeh is an interactive visualization library for modern web browsers.
    It provides elegant, concise construction of versatile graphics,
    and affords high-performance interactivity over large or streaming
    datasets. Bokeh can help anyone who would like to quickly and easily
    make interactive plots, dashboards, and data applications.
  doc_url: https://docs.bokeh.org
  dev_url: https://github.com/bokeh/bokeh

extra:
  recipe-maintainers:
    - almarklein
    - jakirkham
    - mattpap
    - ocefpaf
    - philippjfr
  skip-lints:
    # doc_url is redirecting
    - reachable_url
